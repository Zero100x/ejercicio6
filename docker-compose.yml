version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - rappi_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - rappi_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rappi_network

  order_api:
    build: ./services/order_api
    container_name: order_api
    ports:
      - "3001:3000"
    depends_on:
      - kafka
      - rabbitmq
    networks:
      - rappi_network

  order_processor:
    build: ./services/order_processor
    container_name: order_processor
    ports:
      - "3002:3000"
    depends_on:
      - kafka
      - rabbitmq
    networks:
      - rappi_network

  driver_simulator:
    build: ./services/driver_simulator
    container_name: driver_simulator
    ports:
      - "3003:3000"
    depends_on:
      - kafka
    networks:
      - rappi_network

  notification_router:
    build: ./services/notification_router
    container_name: notification_router
    ports:
      - "3004:3000"
    depends_on:
      - kafka
      - rabbitmq
    networks:
      - rappi_network

  sms_worker:
    build: ./services/sms_worker
    container_name: sms_worker
    ports:
      - "3005:3000"
    depends_on:
      - rabbitmq
    networks:
      - rappi_network

  push_notification_worker:
    build: ./services/push_notification_worker
    container_name: push_notification_worker
    ports:
      - "3006:3000"
    depends_on:
      - rabbitmq
    networks:
      - rappi_network

  dashboard_backend:
    build: ./services/dashboard_backend
    container_name: dashboard_backend
    ports:
      - "3007:3000"
    depends_on:
      - kafka
    networks:
      - rappi_network

networks:
  rappi_network:
    driver: bridge
